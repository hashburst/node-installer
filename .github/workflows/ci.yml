name: HashBurst Node Installer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TEP test dependency
        run: python -m pip install cryptography
      - name: Python syntax
        run: |
          python -m py_compile aggregator/*.py hbfiles/*.py replication/*.py integrations/explorer/patch_hashburst_explorer.py
          python -m py_compile tep/*.py patched/hb_tep.py tools/hb_tep_packet_scan.py tools/tep_staging_network_test.py
          python -m py_compile tests/test_tep_installer_v215.py tests/v2.1.5_release_regression.py
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n bin/hb-tep-onboard
          bash -n ipfs-scripts/01-install-ipfs-dual-ZFS.sh
          bash -n ipfs-scripts/01-install-ipfs-dual-noZFS.sh
          bash -n ipfs-scripts/02-verify.sh
          bash -n tests/network_probe.sh
      - name: Legacy release tests
        run: |
          python tests/v2.1.2_release_regression.py
          python tests/test_release.py
          python tests/test_multipart_bytes.py
      - name: Replication v2.1.3 compatibility tests
        run: python -W error::ResourceWarning -m unittest -v tests.test_replication_policy tests.test_replication_repair tests.test_replica_agent tests.test_replication_hook
      - name: v2.1.4 lifecycle safety
        run: python -W error::ResourceWarning -m unittest -v tests.test_replication_v214 tests.test_replication_v214_policy tests.test_replication_v214_controller tests.test_replication_v214_agent_idempotency
      - name: v2.1.4 release contract
        run: python tests/v2.1.4_release_regression.py
      - name: HB-TEP-APP unit and daemon integration
        run: |
          python -W error::ResourceWarning -m unittest -v \
            tests.test_tep_app_protocol \
            tests.test_tep_app_security \
            tests.test_tep_client \
            tests.test_tep_aggregator \
            tests.test_tep_accounting \
            tests.test_tep_relay \
            tests.test_tep_nat \
            tests.test_tep_wire \
            tests.test_tep_packet_scan \
            tests.test_tep_daemon_step5b \
            tests.test_tep_ipc_step7a \
            tests.test_tep_aggregator_ipc_step7b \
            tests.test_tep_packaging_step7c
      - name: HB-TEP-APP release contract
        run: python tests/tep_release_regression.py
      - name: v2.1.5 installer and onboarding
        run: python -W error::ResourceWarning -m unittest -v tests.test_tep_installer_v215
      - name: v2.1.5 release contract
        run: python tests/v2.1.5_release_regression.py
