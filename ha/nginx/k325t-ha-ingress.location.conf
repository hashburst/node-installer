# Include inside the selected HTTPS server block.
# The backend is loopback-only; HashBurst HA resolves HASHBURST_PRIMARY by TEP identity.
location = /api/v1/bitstream {
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_pass http://127.0.0.1:49010/api/v1/bitstream;
}

location = /hashburst-ha/k325t/healthz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_pass http://127.0.0.1:49010/healthz;
}
