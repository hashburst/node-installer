name: HashBurst Node Installer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TEP test dependency
        run: python -m pip install cryptography
      - name: Python syntax
        run: |
          python -m py_compile aggregator/*.py hbfiles/*.py replication/*.py integrations/explorer/patch_hashburst_explorer.py
          python -m py_compile tep/*.py patched/hb_tep.py tools/hb_tep_packet_scan.py tools/tep_staging_network_test.py ha/*.py
          python -m py_compile tests/test_tep_installer_v215.py tests/test_tep_nat_runtime_v215.py tests/test_tep_identity_enrichment_v216.py tests/test_tep_ha_agent.py tests/test_tep_ha_protocol.py tests/test_tep_ha_v220.py tests/test_tep_v220_service_roles.py tests/v2.1.5_release_regression.py tests/v2.1.6_release_regression.py
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n ha/install-ha.sh
          bash -n ha/arm-ha.sh
          bash -n ha/preflight-tep-host.sh
          bash -n ha/hashburst-rpc-guard.sh
          bash -n bin/hb-tep-onboard
          bash -n bin/hb-node-wallet-bootstrap
          bash -n ipfs-scripts/01-install-ipfs-dual-ZFS.sh
          bash -n ipfs-scripts/01-install-ipfs-dual-noZFS.sh
          bash -n ipfs-scripts/02-verify.sh
          bash -n tests/network_probe.sh
          bash -n tests/v215_installer_sandbox.sh
          bash -n tests/v216_installer_sandbox.sh
          bash -n tests/v215_wallet_cli_probe.sh
          bash -n tests/v215_blockchain_bootstrap.sh
      - name: Packaged blockchain wallet CLI
        run: bash tests/v215_wallet_cli_probe.sh "$PWD"
      - name: v2.1.5 real blockchain bootstrap
        run: bash tests/v215_blockchain_bootstrap.sh "$PWD"
      - name: Legacy release tests
        run: |
          python tests/v2.1.2_release_regression.py
          python tests/test_release.py
          python tests/test_multipart_bytes.py
      - name: Replication v2.1.3 compatibility tests
        run: python -W error::ResourceWarning -m unittest -v tests.test_replication_policy tests.test_replication_repair tests.test_replica_agent tests.test_replication_hook
      - name: v2.1.4 lifecycle safety
        run: python -W error::ResourceWarning -m unittest -v tests.test_replication_v214 tests.test_replication_v214_policy tests.test_replication_v214_controller tests.test_replication_v214_agent_idempotency
      - name: v2.1.4 release contract
        run: python tests/v2.1.4_release_regression.py
      - name: HB-TEP-APP unit and daemon integration
        run: |
          python -W error::ResourceWarning -m unittest -v \
            tests.test_tep_app_protocol \
            tests.test_tep_app_security \
            tests.test_tep_client \
            tests.test_tep_aggregator \
            tests.test_tep_accounting \
            tests.test_tep_relay \
            tests.test_tep_nat \
            tests.test_tep_wire \
            tests.test_tep_packet_scan \
            tests.test_tep_daemon_step5b \
            tests.test_tep_ipc_step7a \
            tests.test_tep_aggregator_ipc_step7b \
            tests.test_tep_packaging_step7c
      - name: HB-TEP-APP release contract
        run: python tests/tep_release_regression.py
      - name: TEP-HA lease and fencing
        run: python -W error::ResourceWarning -m unittest -v tests.test_tep_ha_agent tests.test_tep_ha_protocol tests.test_tep_ha_v220 tests.test_tep_v220_service_roles
      - name: v2.1.5 installer and onboarding
        run: python -W error::ResourceWarning -m unittest -v tests.test_tep_installer_v215
      - name: v2.1.5 NAT runtime
        run: python -W error::ResourceWarning -m unittest -v tests.test_tep_nat_runtime_v215
      - name: v2.1.5 release contract
        run: python tests/v2.1.5_release_regression.py
      - name: v2.1.6 TEP identity enrichment
        run: python -W error::ResourceWarning -m unittest -v tests.test_tep_identity_enrichment_v216
      - name: v2.1.6 installer upgrade/idempotency sandbox
        run: sudo env PATH="$PATH" bash tests/v216_installer_sandbox.sh "$PWD"
      - name: v2.1.6 release contract
        run: python tests/v2.1.6_release_regression.py
