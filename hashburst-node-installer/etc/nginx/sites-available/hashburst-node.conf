# HashBurst Node — nginx configuration
# Replace DOMAIN and SERVER_IP with actual values before use

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=token_limit:1m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://DOMAIN$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN www.DOMAIN;

    root  /var/www/DOMAIN/public;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    access_log /var/log/nginx/hashburst.access.log;
    error_log  /var/log/nginx/hashburst.error.log warn;
    client_max_body_size 20M;

    location / { try_files $uri $uri/ /index.html; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location /api/hashburst/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://127.0.0.1:RPC_PORT/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /ipfs/ {
        proxy_pass         http://127.0.0.1:8080/ipfs/;
        proxy_read_timeout 120s;
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    location /api/tep/ {
        proxy_pass http://127.0.0.1:47778/;
        proxy_read_timeout 5s;
    }

    location ~* (whitelist_tokens\.jsonl|\.env|\.git) { deny all; return 404; }
    location ~ /\. { deny all; }
}
